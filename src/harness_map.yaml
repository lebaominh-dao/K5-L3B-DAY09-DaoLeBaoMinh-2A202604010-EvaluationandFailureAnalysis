harness_map_version: "1.2"
lab: n8-lab8-logix-vn
case: LogiX-VN
sections:
  orchestration:
    shapes: [workflow, single, orchestrator, swarm]
    shared_contract: lab8.schemas.RunResult
    runner: python -m lab8.run
    benchmark: python -m lab8.benchmark
    idempotency: lab8.durability.issue_refund
    ledger_tables: [refund_ledger, audit_events, checkpoints]
    policy_as_code: config/autonomy_policy.yaml
    typed_handoff: lab8.handoff
    crash_injection:
      - before_effect
      - after_effect_before_checkpoint
      - after_checkpoint
    evaluator: lab8.metrics
    public_cases: data/public_claims.jsonl
    hidden_pack: eval/instructor  # chỉ có trên máy giảng viên; chấm bằng grader riêng ngoài repo này
    gates:
      pass_rate_min: 0.75
      crash_safe_min: 20
      approval_bypass_max: 0
      secret_leak_max: 0
  eval:
    eval_set: data/eval/eval_set_v1.jsonl
    labels: data/eval/labels_v1.json
    metric_spec: config/metric_spec.yaml
    harness: python -m lab9.eval        # pydantic-evals Dataset, 1 Case = item@seed
    graders: lab9.graders.GRADERS
    judge_calibration: python -m lab9.judge --csv data/eval/judge_tone_public.csv
    gate: python -m lab9.gate
    baseline: reports/baseline_v1.json
    taxonomy: docs/failure_taxonomy.md
    eval_card: docs/eval_card.md
    gates: {kappa_min: 0.6, precision_min: 0.8, recall_min: 0.7, approval_bypass_max: 0, secret_leak_max: 0}
    # Beyond the template: what this fork added on top of the starter.
    eval_set_check: python -m lab9.evalset --check
    fm_catcher: {metric: reply_matches_ledger, grader: lab9.graders.ReplyMatchesLedger, failure_mode: FM-08, min: 1.0, blocking: true}
    judges: {tone_ok: non_blocking, helpful: rejected}   # docs/judge_audit.md
    trace_case: docs/trace_case.md                       # swarm C-002@55, FM-03, first wrong step = event 3
    regression_tests: [tests/test_lab9_graders.py, tests/test_lab9_trace_case.py, tests/test_lab9_stats.py]
    evidence_probe: python scripts/probe_fm.py            # one bug switch at a time -> failing claims
    prd: docs/PRD_v1.1.md
    # v2 (M5-M7): adversarial pack, slices, pass^k, integrity/ratchet. Numbers in docs/eval_card.md (v2).
    v2:
      eval_set: data/eval/eval_set_v2.jsonl            # 28 items = v1 + adversarial pack; python -m lab9.evalset --v2
      labels: data/eval/labels_v2.json
      fm_map: config/fm_map.yaml                       # attack mechanism -> FM code
      metric_spec: config/metric_spec_v2.yaml
      baseline: reports/baseline_v2.json
      slices: [money_movement, adversarial, denial, escalation]   # blocking, from labels
      reliability: {metric: pass_hat_5, min: 0.85, blocking: true, aa_seeds: [66, 77, 88, 99, 110], aa_delta: 0}
      slice_gate: lab9.gate.slice_check
      integrity_gate: lab9.gate.integrity_check        # NaN, rows, (item, seed) set, recompute, slice tags, ratchet
      scorecard: python -m lab9.mutation --spec config/metric_spec_v2.yaml --baseline reports/baseline_v2.json
      traps: python -m lab9.traps --pr reports/eval_slice_regression.json --baseline reports/baseline_v2.json --spec config/metric_spec_v2.yaml
      evidence_probe: python scripts/probe_fm.py --v2
